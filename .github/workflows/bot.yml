name: Kriz Masası botu

on:
  schedule:
    - cron: "*/10 * * * *"   # her 10 dakikada bir (GitHub bazen birkaç dakika geciktirir)
  workflow_dispatch:          # Actions sekmesinden elle çalıştırmak için

concurrency:
  group: bot
  cancel-in-progress: false

permissions:
  contents: write             # görülen haberler listesini depoya kaydetmek için

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Haberleri tara ve paylaş
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL || '@krizmasasi' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: python -m bot.main

      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "kriz-masasi-bot"
          git config user.email "kriz-masasi-bot@users.noreply.github.com"
          git add state/state.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Durum güncellendi [skip ci]"
          git pull --rebase -q && git push -q
